<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Unlock Full Report - Digital Wellbeing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 max-w-md w-full text-center relative overflow-hidden">
        
        <!-- Mock "Secure" Badge -->
        <div class="absolute top-4 right-4 text-green-400 flex items-center text-xs font-bold uppercase tracking-widest">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            Secure
        </div>

        <div class="mb-6">
            <div id="lock-icon-wrap" class="w-20 h-20 bg-yellow-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <span id="lock-icon" class="text-4xl">🔒</span>
            </div>
            <h1 id="report-title" class="text-2xl font-bold text-white mb-2">Unlock Full Report</h1>
            <p class="text-slate-400">Deep dive into your archetype, specific action plans, and resource toolkit.</p>
        </div>

        <div class="bg-slate-900 rounded-lg p-4 mb-6 border border-slate-700 text-left">
            <div class="flex justify-between items-center mb-2">
                <span class="text-slate-300 font-medium">Digital Wellbeing Audit</span>
                <span id="price-line" class="text-white font-bold">…</span>
            </div>
            <div class="h-px bg-slate-700 my-2"></div>
            <div class="flex justify-between items-center text-sm">
                <span class="text-slate-500">Total due</span>
                <span id="price-total" class="text-yellow-400 font-bold">…</span>
            </div>
        </div>

        <div id="checkout-status" class="mb-4 hidden rounded-lg border border-slate-700 bg-slate-900/80 p-3 text-sm text-slate-300"></div>

        <button id="checkout-btn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-all mb-4" disabled>
            Pay
        </button>
    </div>

    <script type="module">
        const archetypes = {
            1: 'Zombie Clickslave',
            2: 'Unconscious Doomscroller',
            3: 'Digital Drifter',
            4: 'Intentional Architect',
            5: 'Digital Sovereign'
        };

        const urlParams = new URLSearchParams(window.location.search);
        const level = urlParams.get('level');
        const email = urlParams.get('email');
        const status = urlParams.get('status');
        const sessionId = urlParams.get('session_id');
        const checkoutBtn = document.getElementById('checkout-btn');
        const statusEl = document.getElementById('checkout-status');
        const lockIconWrap = document.getElementById('lock-icon-wrap');
        const lockIcon = document.getElementById('lock-icon');
        const priceLine = document.getElementById('price-line');
        const priceTotal = document.getElementById('price-total');

        if (level && archetypes[level]) {
            document.getElementById('report-title').innerHTML = `Unlock <span class="text-yellow-400">${archetypes[level]}</span> Report`;
        }

        function formatPrice(amountInCents, currency) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: (currency || 'usd').toUpperCase() })
                .format(amountInCents / 100);
        }

        let currentPriceLabel = 'Pay';

        function setUnlocked() {
            lockIconWrap.classList.remove('bg-yellow-500/20');
            lockIconWrap.classList.add('bg-green-500/20');
            lockIcon.textContent = '🔓';
        }

        if (status === 'success' && sessionId) {
            checkoutBtn.classList.add('hidden');
            setUnlocked();
            statusEl.innerHTML = 'Payment confirmed! <a href="/.netlify/functions/download-report?session_id=' +
                encodeURIComponent(sessionId) + '" class="underline font-bold">Click here to download your report</a>.';
            statusEl.classList.remove('hidden');
            statusEl.classList.add('border-green-500', 'text-green-300');
        } else if (status === 'success') {
            statusEl.textContent = 'Payment completed, but we could not confirm the session. Please contact support.';
            statusEl.classList.remove('hidden');
            statusEl.classList.add('border-red-500', 'text-red-300');
        }

        if (status === 'cancelled') {
            statusEl.textContent = 'Checkout was cancelled. No charge was made.';
            statusEl.classList.remove('hidden');
            statusEl.classList.add('border-yellow-500', 'text-yellow-300');
        }

        fetch(`/.netlify/functions/get-report-price${level ? `?level=${encodeURIComponent(level)}` : ''}`)
            .then((response) => response.json())
            .then(({ amount, currency }) => {
                const formatted = formatPrice(amount, currency);
                priceLine.textContent = formatted;
                priceTotal.textContent = formatted;
                currentPriceLabel = `Pay ${formatted}`;
                if (status !== 'success') {
                    checkoutBtn.textContent = currentPriceLabel;
                    checkoutBtn.disabled = false;
                }
            })
            .catch(() => {
                priceLine.textContent = 'See checkout';
                priceTotal.textContent = 'See checkout';
                currentPriceLabel = 'Pay Now';
                if (status !== 'success') {
                    checkoutBtn.textContent = currentPriceLabel;
                    checkoutBtn.disabled = false;
                }
            });

        checkoutBtn.addEventListener('click', async () => {
            checkoutBtn.disabled = true;
            checkoutBtn.textContent = 'Preparing checkout...';
            statusEl.textContent = 'Creating your secure checkout session...';
            statusEl.classList.remove('hidden');

            try {
                const response = await fetch('/.netlify/functions/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ level, archetypeName: archetypes[level] || 'your result', email })
                });

                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error || 'Unable to start checkout.');

                if (payload.url) {
                    window.location.href = payload.url;
                } else {
                    throw new Error('Checkout session did not return a URL.');
                }
            } catch (error) {
                statusEl.textContent = error.message || 'Checkout could not be started.';
                statusEl.classList.remove('hidden');
                statusEl.classList.add('border-red-500', 'text-red-300');
                checkoutBtn.disabled = false;
                checkoutBtn.textContent = currentPriceLabel;
            }
        });
    </script>
</body>
</html>
